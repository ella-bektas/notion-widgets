<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coquette Clock — Floating</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .clock-wrap {
    max-width: 360px;
    margin: 0 auto;
    text-align: center;
    padding: 1rem 0;
    box-sizing: border-box;
  }

  .clock-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 0.6rem;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7B2D3E;
  }

  .clock-label svg {
    width: 12px;
    height: 12px;
    fill: #7B2D3E;
  }

  .clock-time {
    font-size: 38px;
    font-weight: 500;
    color: #2A2020;
  }

  .clock-period {
    font-size: 12px;
    color: #C77B8A;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .clock-date {
    font-size: 13px;
    color: #7B2D3E;
    font-style: italic;
    margin-top: 0.5rem;
    border-top: 1px solid #E8CDD3;
    padding-top: 0.5rem;
    display: inline-block;
  }
</style>
</head>
<body>

  <div class="clock-wrap">
    <div class="clock-label">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.4.9-1.3 2.4-2.4 4.5-2.4 4 0 5.7 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span>the time is</span>
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.4.9-1.3 2.4-2.4 4.5-2.4 4 0 5.7 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <div class="clock-time" id="clock-time">--:--</div>
    <div class="clock-period" id="clock-period">--</div>
    <div class="clock-date" id="clock-date">loading...</div>
  </div>

  <script>
    function updateCoquetteClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var period = h >= 12 ? 'pm' : 'am';
      var h12 = h % 12;
      if (h12 === 0) h12 = 12;
      var mStr = m < 10 ? '0' + m : '' + m;

      document.getElementById('clock-time').textContent = h12 + ':' + mStr;
      document.getElementById('clock-period').textContent = period;

      var days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
      var months = ['january','february','march','april','may','june','july','august','september','october','november','december'];
      document.getElementById('clock-date').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
    }

    updateCoquetteClock();
    setInterval(updateCoquetteClock, 15000);
  </script>

</body>
</html>
