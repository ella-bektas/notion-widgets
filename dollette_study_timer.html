<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study timer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .timer-card {
    width: 100%;
    box-sizing: border-box;
    background: #FFF9FB;
    border: 1px solid #F5C6D6;
    border-radius: 20px;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .timer-title {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-size: 20px;
    color: #C97E97;
    margin: 0 0 1.25rem;
  }
  .timer-display {
    font-size: 52px;
    font-weight: 500;
    color: #3A2E30;
    margin-bottom: 1.25rem;
    letter-spacing: 1px;
  }
  .timer-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .timer-controls label {
    font-size: 13px;
    color: #C97E97;
  }
  .timer-controls input[type="range"] {
    flex: 1;
    max-width: 320px;
    accent-color: #E8A5BB;
  }
  .timer-controls span {
    font-size: 13px;
    font-weight: 500;
    color: #C97E97;
    min-width: 20px;
  }
  .timer-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .timer-buttons button {
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  #start-btn {
    background: #FBE4EC;
    border: 1px solid #E8A5BB;
    color: #C97E97;
  }
  #pause-btn, #reset-btn {
    background: #FFF9FB;
    border: 1px solid #E8A5BB;
    color: #C97E97;
  }
  .timer-status {
    font-size: 12px;
    color: #E8A5BB;
    margin: 1rem 0 0;
  }
</style>
</head>
<body>

<div class="timer-card">
  <p class="timer-title">study time &#9825;</p>

  <div id="display" class="timer-display">25:00</div>

  <div class="timer-controls">
    <label for="minutes">minutes</label>
    <input type="range" id="minutes" min="1" max="90" value="25" step="1" />
    <span id="minutes-out">25</span>
  </div>

  <div class="timer-buttons">
    <button id="start-btn">start</button>
    <button id="pause-btn">pause</button>
    <button id="reset-btn">reset</button>
  </div>

  <p id="status" class="timer-status">ready when you are &#9825;</p>
</div>

<script>
(function() {
  var minutesInput = document.getElementById('minutes');
  var minutesOut = document.getElementById('minutes-out');
  var display = document.getElementById('display');
  var status = document.getElementById('status');
  var startBtn = document.getElementById('start-btn');
  var pauseBtn = document.getElementById('pause-btn');
  var resetBtn = document.getElementById('reset-btn');

  var totalSeconds = parseInt(minutesInput.value, 10) * 60;
  var remaining = totalSeconds;
  var timerId = null;

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
  }

  function updateDisplay() {
    display.textContent = formatTime(remaining);
  }

  minutesInput.addEventListener('input', function() {
    minutesOut.textContent = minutesInput.value;
    if (!timerId) {
      totalSeconds = parseInt(minutesInput.value, 10) * 60;
      remaining = totalSeconds;
      updateDisplay();
      status.textContent = 'ready when you are \u2661';
    }
  });

  startBtn.addEventListener('click', function() {
    if (timerId) return;
    if (remaining <= 0) {
      totalSeconds = parseInt(minutesInput.value, 10) * 60;
      remaining = totalSeconds;
    }
    status.textContent = 'focus mode, you\'ve got this \u2661';
    timerId = setInterval(function() {
      remaining -= 1;
      if (remaining <= 0) {
        remaining = 0;
        updateDisplay();
        clearInterval(timerId);
        timerId = null;
        status.textContent = 'time\'s up, well done \u2661';
        return;
      }
      updateDisplay();
    }, 1000);
  });

  pauseBtn.addEventListener('click', function() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      status.textContent = 'paused, take a breath \u2661';
    }
  });

  resetBtn.addEventListener('click', function() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
    totalSeconds = parseInt(minutesInput.value, 10) * 60;
    remaining = totalSeconds;
    updateDisplay();
    status.textContent = 'ready when you are \u2661';
  });

  updateDisplay();
})();
</script>

</body>
</html>
