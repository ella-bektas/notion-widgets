<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Tracker — Dollette Outline</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Georgia, 'Times New Roman', serif;
    width: 100%;
    overflow-x: hidden;
    box-sizing: border-box;
  }

  .moon-card {
    background: #FFFDFC;
    border: 1px solid #E8CDD3;
    border-radius: 20px;
    padding: 1.1rem 1.3rem;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .moon-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 0.8rem;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B98A96;
  }

  .moon-label svg {
    width: 11px;
    height: 11px;
    fill: #B98A96;
  }

  .moon-row {
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }

  .moon-icon-tile {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: #FCEFF1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .moon-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #F3E4E7;
    position: relative;
    overflow: hidden;
  }

  .moon-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #B98A96;
  }

  .moon-text {
    text-align: left;
  }

  .moon-phase-name {
    font-size: 18px;
    color: #3A2020;
    font-weight: 500;
  }

  .moon-meta {
    font-size: 11px;
    color: #B98A96;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .moon-dots {
    display: flex;
    justify-content: space-between;
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 1px solid #F3E4E7;
  }

  .moon-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #F3E4E7;
  }

  .moon-dot.active {
    background: #B98A96;
  }
</style>
</head>
<body>

  <div class="moon-card">
    <div class="moon-label">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.4.9-1.3 2.4-2.4 4.5-2.4 4 0 5.7 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span>moon tracker</span>
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.4.9-1.3 2.4-2.4 4.5-2.4 4 0 5.7 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <div class="moon-row">
      <div class="moon-icon-tile">
        <div class="moon-icon">
          <div class="moon-shadow" id="moon-shadow"></div>
        </div>
      </div>
      <div class="moon-text">
        <div class="moon-phase-name" id="moon-phase-name">loading...</div>
        <div class="moon-meta" id="moon-meta">-- illuminated · day --</div>
      </div>
    </div>

    <div class="moon-dots" id="moon-dots">
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
      <div class="moon-dot"></div>
    </div>
  </div>

  <script>
    function updateMoonTracker() {
      var synodicMonth = 29.53058867;
      var knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
      var now = new Date();
      var diffDays = (now.getTime() - knownNewMoon) / 86400000;
      var phaseDays = ((diffDays % synodicMonth) + synodicMonth) % synodicMonth;
      var p = phaseDays / synodicMonth;

      var illumination = (1 - Math.cos(2 * Math.PI * p)) / 2;
      var illumPercent = Math.round(illumination * 100);
      var dayOfCycle = Math.floor(phaseDays) + 1;

      var phaseName;
      if (p < 0.0625 || p >= 0.9375) phaseName = 'New Moon';
      else if (p < 0.1875) phaseName = 'Waxing Crescent';
      else if (p < 0.3125) phaseName = 'First Quarter';
      else if (p < 0.4375) phaseName = 'Waxing Gibbous';
      else if (p < 0.5625) phaseName = 'Full Moon';
      else if (p < 0.6875) phaseName = 'Waning Gibbous';
      else if (p < 0.8125) phaseName = 'Last Quarter';
      else phaseName = 'Waning Crescent';

      var size = 38;
      var sign = p < 0.5 ? -1 : 1;
      var offset = sign * illumination * size;

      // ensure the shadow fully clears at true full moon rather than leaving a rounding sliver
      if (illumPercent >= 100) offset = sign * size;

      document.getElementById('moon-shadow').style.left = offset + 'px';
      document.getElementById('moon-phase-name').textContent = phaseName;
      document.getElementById('moon-meta').textContent = illumPercent + '% illuminated · day ' + dayOfCycle;

      var dotIndex = Math.floor(p * 8) % 8;
      var dots = document.querySelectorAll('#moon-dots .moon-dot');
      dots.forEach(function (dot, i) {
        dot.classList.toggle('active', i === dotIndex);
      });
    }

    updateMoonTracker();
    setInterval(updateMoonTracker, 1000 * 60 * 30);
  </script>

</body>
</html>
