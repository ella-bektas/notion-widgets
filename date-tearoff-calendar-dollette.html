<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tear-Off Calendar — Dollette</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .page-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .page-card {
    width: 100%;
    max-width: 600px;
    background: #FFFDFC;
    border: 1px solid #E8CDD3;
    border-radius: 4px 4px 0 0;
    text-align: center;
    box-shadow: 0 2px 6px rgba(185, 138, 150, 0.15);
    box-sizing: border-box;
  }

  .page-month {
    background: #B98A96;
    color: #FFFDFC;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px;
    border-radius: 4px 4px 0 0;
  }

  .page-day-number {
    font-size: clamp(36px, 12vw, 64px);
    color: #2A2020;
    padding: 0.4rem 0 0;
    line-height: 1;
  }

  .page-weekday {
    font-size: 11px;
    color: #B98A96;
    padding-bottom: 0.5rem;
  }

  .page-footer {
    border-top: 1px dashed #E8CDD3;
    padding: 0.4rem 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .page-footer svg {
    width: 13px;
    height: 13px;
  }

  .page-season {
    font-size: 9px;
    color: #B98A96;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="page-wrap">
    <div class="page-card">
      <div class="page-month" id="page-month">---</div>
      <div class="page-day-number" id="page-day">--</div>
      <div class="page-weekday" id="page-weekday">---</div>
      <div class="page-footer">
        <span id="season-icon"></span>
        <span class="page-season" id="page-season">----</span>
      </div>
    </div>
  </div>

  <script>
    var seasonIcons = {
      spring: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.4" stroke-linejoin="round"><path d="M12 12c0-3 1.5-5 4-5s3 2 1.5 3.5S12 12 12 12zM12 12c0-3-1.5-5-4-5s-3 2-1.5 3.5S12 12 12 12zM12 12c3 0 5 1.5 5 4s-2 3-3.5 1.5S12 12 12 12zM12 12c-3 0-5 1.5-5 4s2 3 3.5 1.5S12 12 12 12z" fill="#F0DDE0"/><circle cx="12" cy="12" r="1.6" fill="#B98A96" stroke="none"/><path d="M12 16v5"/></svg>',
      summer: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#F0DDE0"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>',
      autumn: '<svg viewBox="0 0 24 24" fill="#F0DDE0" stroke="#B98A96" stroke-width="1.3" stroke-linejoin="round"><path d="M12 3c4 2 6 6 5 10-1 3.5-4 6-5 8-1-2-4-4.5-5-8-1-4 1-8 5-10z"/><path d="M12 3v18"/></svg>',
      winter: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.4" stroke-linecap="round"><path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11"/><path d="M12 5l-1.5 1.5M12 5l1.5 1.5M12 19l-1.5-1.5M12 19l1.5-1.5M6 8l0.3 2M6 8l2-0.3M18 8l-0.3 2M18 8l-2-0.3M6 16l0.3-2M6 16l2 0.3M18 16l-0.3-2M18 16l-2 0.3"/></svg>'
    };

    function getSeason(month) {
      if (month === 12 || month === 1 || month === 2) return 'winter';
      if (month >= 3 && month <= 5) return 'spring';
      if (month >= 6 && month <= 8) return 'summer';
      return 'autumn';
    }

    function updatePage() {
      var now = new Date();
      var days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
      var months = ['january','february','march','april','may','june','july','august','september','october','november','december'];

      var season = getSeason(now.getMonth() + 1);

      document.getElementById('page-month').textContent = months[now.getMonth()];
      document.getElementById('page-day').textContent = now.getDate();
      document.getElementById('page-weekday').textContent = days[now.getDay()];
      document.getElementById('page-season').textContent = season;
      document.getElementById('season-icon').innerHTML = seasonIcons[season];
    }

    updatePage();
    setInterval(updatePage, 1000 * 60 * 30);
  </script>

</body>
</html>
