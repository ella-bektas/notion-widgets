<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Dollette</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .weather-card {
    background: #FFFDFC;
    border: 1px solid #E8CDD3;
    border-radius: 20px;
    padding: 1.1rem 1.3rem;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .weather-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 0.8rem;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B98A96;
  }

  .weather-label svg {
    width: 11px;
    height: 11px;
    fill: #B98A96;
  }

  .weather-row {
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }

  .weather-icon-tile {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: #FCEFF1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .weather-icon-tile svg {
    width: 32px;
    height: 32px;
  }

  .weather-text {
    text-align: left;
  }

  .weather-temp {
    font-size: 22px;
    color: #3A2020;
    font-weight: 500;
  }

  .weather-meta {
    font-size: 11px;
    color: #B98A96;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .weather-fallback {
    text-align: center;
    padding: 0.6rem 0.2rem;
  }

  .weather-fallback p {
    font-size: 13px;
    color: #B98A96;
    font-style: italic;
    margin: 0 0 0.7rem;
  }

  .weather-retry {
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #FFFDFC;
    background: #B98A96;
    border: none;
    border-radius: 20px;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="weather-card">
    <div class="weather-label">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.4.9-1.3 2.4-2.4 4.5-2.4 4 0 5.7 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span>weather</span>
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.4.9-1.3 2.4-2.4 4.5-2.4 4 0 5.7 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <div id="weather-body">
      <div class="weather-fallback">
        <p>loading local weather...</p>
      </div>
    </div>
  </div>

  <script>
    var weatherIcons = {
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>',
      cloud: '<svg viewBox="0 0 24 24" fill="#E8CDD3" stroke="#B98A96" stroke-width="1.2"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 9.1 4 4 0 0 0 7 18z"/></svg>',
      rain: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 6.1 4 4 0 0 0 7 15z" fill="#E8CDD3"/><path d="M9 18.5l-1 2M13 18.5l-1 2M17 18.5l-1 2"/></svg>',
      snow: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 6.1 4 4 0 0 0 7 15z" fill="#E8CDD3"/><path d="M9 18v3M13 18v3M17 18v3"/></svg>',
      storm: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 4.1 4 4 0 0 0 7 13z" fill="#E8CDD3"/><path d="M12 14l-2.5 4h3L11 21"/></svg>',
      fog: '<svg viewBox="0 0 24 24" fill="none" stroke="#B98A96" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h13M4 13h16M4 17h13"/></svg>'
    };

    function iconForCode(code) {
      if (code === 0) return weatherIcons.sun;
      if (code >= 1 && code <= 3) return weatherIcons.cloud;
      if (code === 45 || code === 48) return weatherIcons.fog;
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return weatherIcons.rain;
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) return weatherIcons.snow;
      if (code === 95 || code === 96 || code === 99) return weatherIcons.storm;
      return weatherIcons.cloud;
    }

    function textForCode(code) {
      if (code === 0) return 'clear sky';
      if (code === 1) return 'mainly clear';
      if (code === 2) return 'partly cloudy';
      if (code === 3) return 'overcast';
      if (code === 45 || code === 48) return 'foggy';
      if (code >= 51 && code <= 57) return 'drizzle';
      if (code >= 61 && code <= 67) return 'rain';
      if (code >= 71 && code <= 77) return 'snow';
      if (code >= 80 && code <= 82) return 'rain showers';
      if (code === 85 || code === 86) return 'snow showers';
      if (code >= 95) return 'thunderstorm';
      return 'cloudy';
    }

    function renderFallback(message, showRetry) {
      var body = document.getElementById('weather-body');
      body.innerHTML =
        '<div class="weather-fallback">' +
          '<p>' + message + '</p>' +
          (showRetry ? '<button class="weather-retry" onclick="requestWeather()">try again</button>' : '') +
        '</div>';
    }

    function renderWeather(tempC, code) {
      var days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
      var today = days[new Date().getDay()];
      var body = document.getElementById('weather-body');
      body.innerHTML =
        '<div class="weather-row">' +
          '<div class="weather-icon-tile">' + iconForCode(code) + '</div>' +
          '<div class="weather-text">' +
            '<div class="weather-temp">' + Math.round(tempC) + '&deg;</div>' +
            '<div class="weather-meta">' + textForCode(code) + ' &middot; ' + today + '</div>' +
          '</div>' +
        '</div>';
    }

    function fetchWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true';
      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.current_weather) {
            renderWeather(data.current_weather.temperature, data.current_weather.weathercode);
          } else {
            renderFallback('weather unavailable right now', true);
          }
        })
        .catch(function () {
          renderFallback('weather unavailable right now', true);
        });
    }

    function requestWeather() {
      renderFallback('loading local weather...', false);

      if (!navigator.geolocation) {
        renderFallback('location not supported here', false);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          fetchWeather(position.coords.latitude, position.coords.longitude);
        },
        function () {
          renderFallback('enable location for local weather', true);
        },
        { timeout: 8000 }
      );
    }

    requestWeather();
    setInterval(requestWeather, 1000 * 60 * 30);
  </script>

</body>
</html>
